name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop, audit/core-safety-hardening]

permissions:
  contents: read

jobs:
  style:
    name: Format and public naming
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt update && sudo apt install -y clang-format

      - name: Check newly maintained runtime sources
        run: clang-format --dry-run --Werror src/cHTTPX_worker.c src/cHTTPX_worker.h tests/fuzz_headers.c

      - name: Reject legacy result names outside compatibility aliases
        shell: bash
        run: |
          set -euo pipefail
          matches="$(
            grep -R -nE '\bCHTTPX_(OK|ERR_[A-Z0-9_]+)\b' src include example tests 2>/dev/null               | grep -vE '^(src/cHTTPX_serv\.h|include/libchttpx\.h):[0-9]+:#define CHTTPX_(OK|ERR_[A-Z0-9_]+) '               || true
          )"
          if [ -n "$matches" ]; then
            echo "Use canonical cHTTPX_OK / cHTTPX_ERR_* result names:"
            echo "$matches"
            exit 1
          fi

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt update && sudo apt install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            -I include \
            -I src \
            --error-exitcode=1 \
            src/ include/ example/

  build-linux:
    name: Build and test (Linux)
    needs: [style, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libcjson-dev zlib1g-dev

      - name: Build binary
        run: make lin

      - name: Build examples
        run: make examples

      - name: Build shared library
        run: make libchttpx.so

      - name: Run tests
        run: make test

  sanitizers:
    name: ASan, UBSan and TSan
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libcjson-dev zlib1g-dev

      - name: Run ASan and UBSan
        run: make test-sanitize

      - name: Run ThreadSanitizer
        run: make test-tsan

  fuzz-smoke:
    name: HTTP parser fuzz smoke
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y clang make libcjson-dev zlib1g-dev

      - name: Run fuzz smoke test
        run: make test-fuzz

  package-smoke:
    name: Package validation
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libcjson-dev zlib1g-dev

      - name: Build release archive
        run: make lin-lib

      - name: Validate archive contents
        shell: bash
        run: |
          set -euo pipefail
          test -f libchttpx-dev.tar.gz
          tar -tzf libchttpx-dev.tar.gz > /tmp/libchttpx-package-files.txt
          grep -q '^libchttpx-dev/include/libchttpx.h
  build-linux-tls:
    name: Build + HTTPS integration (Linux, OpenSSL)
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libcjson-dev zlib1g-dev libssl-dev openssl

      - name: Build TLS-enabled shared library
        run: make TLS=1 libchttpx.so

      - name: Build HTTPS example
        run: make examples-tls

      - name: Run HTTPS integration test
        run: make test-tls

  build-linux-compression:
    name: Response compression integration (Linux, zlib)
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libcjson-dev zlib1g-dev libssl-dev

      - name: Build shared library
        run: make libchttpx.so

      - name: Build compression example
        run: make examples-compression

      - name: Run compression integration tests
        run: make test-compression

      - name: Verify TLS build keeps compression support
        run: |
          make clean
          make TLS=1 libchttpx.so

  build-windows:
    name: Build (Windows)
    needs: style
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-zlib

      - name: Build
        run: mingw32-make win SHELL=cmd

      - name: Run tests
        run: mingw32-make test-win SHELL=cmd
 /tmp/libchttpx-package-files.txt
          grep -q '^libchttpx-dev/libchttpx.so
