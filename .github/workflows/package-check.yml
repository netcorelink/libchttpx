name: Linux Packages

on:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "Makefile"
      - "packaging/**"
      - ".github/actions/build-linux-packages/**"
      - ".github/workflows/package-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native packages
        uses: ./.github/actions/build-linux-packages
        with:
          version: 0.0.0-pr.${{ github.event.pull_request.number || github.run_number }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libchttpx-linux-packages
          path: dist/packages/*
          if-no-files-found: error
