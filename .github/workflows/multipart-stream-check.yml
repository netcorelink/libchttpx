name: Multipart stream check

on:
  push:
    branches:
      - fix/stream-multipart-upload

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev cppcheck

      - name: Build core tests
        run: |
          mkdir -p .build
          gcc -std=gnu11 -Wall -Wextra -Werror -Iinclude tests/test_core.c src/*.c -lcjson -lpthread -o .build/test_core

      - name: Run core tests
        run: ./.build/test_core

      - name: Build shared library
        run: make clean && make libchttpx.so

      - name: Static analysis
        run: cppcheck --enable=warning,performance,portability --suppress=missingIncludeSystem --inline-suppr -I include --error-exitcode=1 src/ include/
