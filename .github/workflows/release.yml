# Runs when a tag is pushed manually (local: git push origin v1.5.6).
# Tags created by Auto Release Tag do NOT trigger this workflow (GitHub limitation).
# Use "Run workflow" below to publish an existing tag without re-pushing it.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.5.6)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libcjson-dev zlib1g-dev

      - name: Build release archive
        run: make lin-lib

      - name: Build native Linux packages
        uses: ./.github/actions/build-linux-packages
        with:
          version: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: libchttpx ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            libchttpx-dev.tar.gz
            dist/packages/*
          body: |
            <p align="center">
              <img alt="golangci-lint logo" src="https://avatars.githubusercontent.com/u/252895549?s=400&u=6c747c431c2844620af7772fcd716ef423a6ab1d&v=4" height="150" />
              <h3 align="center">netcorelink/libchttpx</h3>
              <p align="center">A powerful HTTP/2 server library in C/C++ for Linux</p>
            </p>

            ---

            ## Linux native packages

            Download the package for your distribution from this release, then install it with the system package manager:

            ```bash
            # Debian / Ubuntu (APT repository)
            curl -fsSL https://netcorelink.github.io/libchttpx/apt/libchttpx.sources \
              | sudo tee /etc/apt/sources.list.d/libchttpx.sources >/dev/null
            sudo apt update
            sudo apt install libchttpx-dev

            # Fedora / RHEL
            sudo dnf install ./libchttpx-dev-*.rpm

            # Arch Linux
            sudo pacman -U ./libchttpx-dev-*.pkg.tar.zst

            # Alpine Linux
            sudo apk add --allow-untrusted ./libchttpx-dev_*.apk
            ```

            The legacy install script remains available as a fallback:

            ```bash
            curl -s https://raw.githubusercontent.com/netcorelink/libchttpx/main/scripts/install.sh | sudo sh
            ```

      - name: Checkout APT repository
        uses: actions/checkout@v4
        with:
          ref: packages
          path: .apt-repository
          fetch-depth: 0

      - name: Publish Debian package to APT repository
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          DEB_PACKAGE="$(find dist/packages -maxdepth 1 -type f -name 'libchttpx-dev_*_amd64.deb' -print -quit)"

          if [ -z "${DEB_PACKAGE}" ]; then
            echo "Debian package was not found in dist/packages." >&2
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils

          REPO="${GITHUB_WORKSPACE}/.apt-repository"
          POOL="${REPO}/apt/pool/main/l/libchttpx"
          INDEX="${REPO}/apt/dists/stable/main/binary-amd64"

          mkdir -p "${POOL}" "${INDEX}"
          cp "${DEB_PACKAGE}" "${POOL}/"

          (
            cd "${REPO}/apt"

            dpkg-scanpackages --arch amd64 pool /dev/null \
              > dists/stable/main/binary-amd64/Packages

            gzip -9c dists/stable/main/binary-amd64/Packages \
              > dists/stable/main/binary-amd64/Packages.gz

            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="netcorelink" \
              -o APT::FTPArchive::Release::Label="libchttpx" \
              -o APT::FTPArchive::Release::Suite="stable" \
              -o APT::FTPArchive::Release::Codename="stable" \
              -o APT::FTPArchive::Release::Architectures="amd64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="libchttpx APT repository" \
              release dists/stable \
              > dists/stable/Release
          )

          printf '%s\n' "${RELEASE_TAG}" > "${REPO}/publish/version.txt"

          cd "${REPO}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apt publish/version.txt

          if git diff --cached --quiet; then
            echo "APT repository is already up to date."
          else
            git commit -m "packages: publish libchttpx-dev ${VERSION}"
            git push origin HEAD:packages
          fi

      - name: Refresh GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
