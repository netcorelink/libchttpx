name: Auto Release Tag

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release_version.outputs.changed }}
      version_tag: ${{ steps.release_version.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        uses: paulhatch/semantic-version@v6.0.3
        id: version
        with:
          tag_prefix: v
          major_pattern: '/BREAKING CHANGE|^[a-z]+(\([^\r\n]+\))?!:/m'
          minor_pattern: '/^feat(\([^\r\n]+\))?:/m'
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true

      - name: Resolve version against all release tags
        id: release_version
        shell: python
        env:
          CANDIDATE_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION_TYPE: ${{ steps.version.outputs.version_type }}
        run: |
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def version(tag):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(map(int, match.groups())) if match else None

          git("fetch", "origin", "--tags")
          head = git("rev-parse", "HEAD")
          tags = {tag: version(tag) for tag in git("tag", "--list").splitlines()
                  if version(tag) is not None}
          existing = [tag for tag in tags if git("rev-list", "-1", tag) == head]
          if existing:
              tag = max(existing, key=version)
              changed = "false"
              print(f"Commit already released as {tag}; skipping tag creation.")
          else:
              tag = os.environ["CANDIDATE_TAG"]
              candidate = version(tag)
              if candidate is None:
                  raise ValueError(f"Invalid release tag: {tag}")
              latest = max(tags.values(), default=(0, 0, 0))
              if candidate <= latest:
                  major, minor, patch = latest
                  bump = os.environ["VERSION_TYPE"]
                  if bump == "major":
                      candidate = (major + 1, 0, 0)
                  elif bump == "minor":
                      candidate = (major, minor + 1, 0)
                  else:
                      candidate = (major, minor, patch + 1)
                  tag = "v" + ".".join(map(str, candidate))
              changed = "true"
              print(f"Release tag: {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"changed={changed}\nversion_tag={tag}\n")

      - name: Create and push tag
        if: steps.release_version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

  release:
    needs: tag
    if: needs.tag.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version_tag }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libcjson-dev

      - name: Build release archive
        run: make lin-lib

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version_tag }}
          name: libchttpx ${{ needs.tag.outputs.version_tag }}
          files: libchttpx-dev.tar.gz
          body: |
            <p align="center">
              <img alt="golangci-lint logo" src="https://avatars.githubusercontent.com/u/252895549?s=400&u=6c747c431c2844620af7772fcd716ef423a6ab1d&v=4" height="150" />
              <h3 align="center">netcorelink/libchttpx</h3>
              <p align="center">A powerful, cross-platform HTTP server library in C/C++ for building full-featured web servers</p>
            </p>

            ---

            > :warning: **Warning:** Use the `linux environment` for stable library operation.

            ## Linux

            ```bash
            curl -s https://raw.githubusercontent.com/netcorelink/libchttpx/main/scripts/install.sh | sudo sh
            ```

            ## Windows

            ```powershell
            iwr https://raw.githubusercontent.com/netcorelink/libchttpx/main/scripts/install.ps1 -UseBasicParsing | iex
            ```
