name: Auto Release Tag

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release_version.outputs.changed }}
      version_tag: ${{ steps.release_version.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: release_version
        shell: python
        run: |
          import os
          import re
          import subprocess

          SEMVER = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          BREAKING_SUBJECT = re.compile(r"^[a-z]+(?:\([^\r\n]+\))?!:", re.IGNORECASE)
          FEATURE_SUBJECT = re.compile(r"^feat(?:\([^\r\n]+\))?:", re.IGNORECASE)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def parse_version(tag):
              match = SEMVER.fullmatch(tag)
              return tuple(map(int, match.groups())) if match else None

          git("fetch", "origin", "--tags")
          head = git("rev-parse", "HEAD")

          tags = {}
          for tag in git("tag", "--list").splitlines():
              parsed = parse_version(tag)
              if parsed is not None:
                  tags[tag] = parsed

          existing = [tag for tag in tags if git("rev-list", "-1", tag) == head]
          if existing:
              release_tag = max(existing, key=lambda tag: tags[tag])
              changed = "false"
              bump = "none"
              print(f"Commit already released as {release_tag}; skipping tag creation.")
          else:
              latest_tag = max(tags, key=lambda tag: tags[tag]) if tags else None
              latest = tags[latest_tag] if latest_tag else (0, 0, 0)

              revision_range = f"{latest_tag}..HEAD" if latest_tag else "HEAD"
              log = git("log", revision_range, "--format=%s%x1f%b%x1e")

              breaking = False
              feature = False
              for record in log.split("\x1e"):
                  if not record.strip():
                      continue
                  subject, _, body = record.partition("\x1f")
                  subject = subject.strip()
                  body = body.strip()

                  if BREAKING_SUBJECT.search(subject) or re.search(
                      r"(^|\n)BREAKING(?: |-)?CHANGE:\s*",
                      body,
                      re.IGNORECASE,
                  ):
                      breaking = True
                  if FEATURE_SUBJECT.search(subject):
                      feature = True

              major, minor, patch = latest
              if breaking:
                  next_version = (major + 1, 0, 0)
                  bump = "major"
              elif feature:
                  next_version = (major, minor + 1, 0)
                  bump = "minor"
              else:
                  next_version = (major, minor, patch + 1)
                  bump = "patch"

              release_tag = "v" + ".".join(map(str, next_version))
              changed = "true"
              print(f"Latest release: {latest_tag or 'none'}")
              print(f"Detected bump: {bump}")
              print(f"Release tag: {release_tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={changed}\n")
              output.write(f"version_tag={release_tag}\n")
              output.write(f"version_type={bump}\n")

      - name: Create and push tag
        if: steps.release_version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

  release:
    needs: tag
    if: needs.tag.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version_tag }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libcjson-dev zlib1g-dev

      - name: Build release archive
        run: make lin-lib

      - name: Build native Linux packages
        uses: ./.github/actions/build-linux-packages
        with:
          version: ${{ needs.tag.outputs.version_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version_tag }}
          name: libchttpx ${{ needs.tag.outputs.version_tag }}
          files: |
            libchttpx-dev.tar.gz
            dist/packages/*
          body: |
            <p align="center">
              <img alt="golangci-lint logo" src="https://avatars.githubusercontent.com/u/252895549?s=400&u=6c747c431c2844620af7772fcd716ef423a6ab1d&v=4" height="150" />
              <h3 align="center">netcorelink/libchttpx</h3>
              <p align="center">A powerful HTTP/2 server library in C/C++ for Linux</p>
            </p>

            ---

            ## Linux native packages

            Download the package for your distribution from this release, then install it with the system package manager:

            ```bash
            # Debian / Ubuntu (APT repository)
            curl -fsSL https://netcorelink.github.io/libchttpx/apt/libchttpx.sources \
              | sudo tee /etc/apt/sources.list.d/libchttpx.sources >/dev/null
            sudo apt update
            sudo apt install libchttpx-dev

            # Fedora / RHEL
            sudo dnf install ./libchttpx-dev-*.rpm

            # Arch Linux
            sudo pacman -U ./libchttpx-dev_*.pkg.tar.zst

            # Alpine Linux
            sudo apk add --allow-untrusted ./libchttpx-dev_*.apk
            ```

            The legacy install script remains available as a fallback:

            ```bash
            curl -s https://raw.githubusercontent.com/netcorelink/libchttpx/main/scripts/install.sh | sudo sh
            ```

      - name: Checkout APT repository
        uses: actions/checkout@v4
        with:
          ref: packages
          path: .apt-repository
          fetch-depth: 0

      - name: Publish Debian package to APT repository
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.version_tag }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          DEB_PACKAGE="$(find dist/packages -maxdepth 1 -type f -name 'libchttpx-dev_*_amd64.deb' -print -quit)"

          if [ -z "${DEB_PACKAGE}" ]; then
            echo "Debian package was not found in dist/packages." >&2
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils

          REPO="${GITHUB_WORKSPACE}/.apt-repository"
          POOL="${REPO}/apt/pool/main/l/libchttpx"
          INDEX="${REPO}/apt/dists/stable/main/binary-amd64"

          mkdir -p "${POOL}" "${INDEX}"
          cp "${DEB_PACKAGE}" "${POOL}/"

          (
            cd "${REPO}/apt"

            dpkg-scanpackages --arch amd64 pool /dev/null \
              > dists/stable/main/binary-amd64/Packages

            gzip -9c dists/stable/main/binary-amd64/Packages \
              > dists/stable/main/binary-amd64/Packages.gz

            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="netcorelink" \
              -o APT::FTPArchive::Release::Label="libchttpx" \
              -o APT::FTPArchive::Release::Suite="stable" \
              -o APT::FTPArchive::Release::Codename="stable" \
              -o APT::FTPArchive::Release::Architectures="amd64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="libchttpx APT repository" \
              release dists/stable \
              > dists/stable/Release
          )

          printf '%s\n' "${RELEASE_TAG}" > "${REPO}/publish/version.txt"

          cd "${REPO}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apt publish/version.txt

          if git diff --cached --quiet; then
            echo "APT repository is already up to date."
          else
            git commit -m "packages: publish libchttpx-dev ${VERSION}"
            git push origin HEAD:packages
          fi

      - name: Refresh GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
