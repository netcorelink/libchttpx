name: Documentation Site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          ref: packages
          path: .package-repository
          fetch-depth: 1

      - name: Build documentation content from docs READMEs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/site/content
          mkdir -p docs/site/content

          for readme in docs/*/README.md; do
            module_name="$(basename "$(dirname "$readme")")"
            if [ "$module_name" = "site" ]; then
              continue
            fi
            cp "$readme" "docs/site/content/${module_name}.md"
          done

      - name: Add APT repository to site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/site/apt
          cp -a .package-repository/apt docs/site/apt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
